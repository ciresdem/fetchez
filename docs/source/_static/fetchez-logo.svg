<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 300 200"
   width="300"
   height="200"
   version="1.1"
   id="svg178"
   shape-rendering="crispEdges"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs101665" />
  <!-- STYLE DEFINITIONS -->
  <style
     id="style101648">
    rect {
    stroke-width: 4.8;
    stroke-linejoin: round;
    rx: 0.65px;
    stroke: #000000;
    stroke-width: 0.44px;
    stroke-opacity: 0.425;
    }
    .cow-white { fill: #F4F6F7; stroke: #2A2F35; }
    .cow-black-top { fill: #2A2F35; stroke: #4E9FE5; }
    .sky { fill: #4E9FE5; stroke: #4E9FE5; }
    .cow-black-bot { fill: #2A2F35; stroke: #2A2F35; }
    .motion-gold { fill: #FFD700; stroke: #111111; }
    .castle { fill: #708090; stroke: #3A4045; }
  </style>
  <!-- TOP ROW -->
  <!-- Cow White: Black stroke outlines the back/tail of the cow -->
  <rect
     x="0"
     y="0"
     width="100"
     height="100"
     class="cow-white"
     id="rect101650"/>
  <!-- Cow Black (Top): Blue stroke creates a sharp, clean silhouette against the sky -->
  <rect
     x="100"
     y="0"
     width="100"
     height="100"
     class="cow-black-top"
     id="rect101652"/>
  <!-- Sky Blue: Standard matching stroke so the air stays seamless -->
  <rect
     x="200"
     y="0"
     width="100"
     height="100"
     class="sky"
     id="rect101654"/>
  <!-- BOTTOM ROW -->
  <!-- Cow Black (Bottom): Black stroke merges it seamlessly with the top-left white pixel -->
  <rect
     x="0"
     y="101"
     width="100"
     height="100"
     class="cow-black-bot"
     id="rect101656"/>
  <!-- Motion Gold: Dark charcoal outline contains the explosion explosion trail -->
  <rect
     x="100"
     y="101"
     width="100"
     height="100"
     class="motion-gold"
     id="rect101658"/>
  <!-- Castle Grey: Deep stone outline grounds the castle structure -->
  <rect
     x="200"
     y="101"
     width="100"
     height="100"
     class="castle"
     id="rect101660"/>
</svg>
