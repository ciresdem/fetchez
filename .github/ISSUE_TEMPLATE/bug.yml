name: "🐞 Bug"
description: >
  A bug is a crash or behavior that's unexpected or differs from documentation.

labels:
  - "bug"

body:
  - type: "textarea"
    attributes:
      label: "Current behavior"
      description: "A concise description of what you're experiencing."
    validations:
      required: true

  - type: "textarea"
    attributes:
      label: "Expected behavior"
      description: A concise description of what you expected to happen.
    validations:
      required: true

  - type: "textarea"
    attributes:
      label: "Steps to reproduce"
      description: |
        For example:

        ```text
        1. In this environment: ... (e.g. OS, Python version)
        2. With this config: ...
        3. Run command: `...`
        4. See error: ...
        ```
    validations:
      required: false

  - type: "textarea"
    attributes:
      label: "Environment details"
      description: |
        Please run `pip list` or `uv sync` to share the versions of all installed packages!
      value: |
        <details>
        <summary>The output of `pip list` or `uv sync`</summary>

        ```
        <!-- paste here -->
        ```

        </details>
      render: "markdown"
    validations:
      required: false

  - type: "textarea"
    attributes:
      label: "Additional context"
      description: |
        Any additional information that might be helpful in resolving this issue, such as:

        - Error messages or stack traces
        - Relevant configuration files or code snippets
        - Potentially related variables

        Tip: You can attach files or images by clicking this textbox to highlight it, and then dragging files in.
    validations:
      required: false
